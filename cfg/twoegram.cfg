# twoegram: a ProDOS 8 system program, loaded and entered at $2000.
#
# Newsiie's layout, started from cc65's apple2enh-system.cfg. Main memory
# is laid out as PLAN.md section 6 describes.
#
# LOWMEM is $0800-$1FFF: ProDOS leaves it to a SYS program, and nothing is
# loaded there, so it holds LOWBSS, big buffers. LOWBSS is NOT zeroed at
# startup: only put there what is written before it is read.

SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $00FF; # ProDOS file type SYS
    __STACKSIZE__: type = weak, value = $0200; # 512-byte C stack: with
                                               # static locals (-Cl) it holds
                                               # only arguments and
                                               # temporaries (Newsiie
                                               # measured 84 deep)
    __LCADDR__:    type = weak, value = $D400; # behind the quit code
    __LCSIZE__:    type = weak, value = $0C00; # rest of bank two
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,         size = $001A;
    LOWMEM: file = "", define = yes, start = $0800,         size = $1800;
    HEADER: file = %O,               start = $2000 - $003A, size = $003A;
    MAIN:   file = %O, define = yes, start = $2000,         size = $BF00 - $2000;
    BSS:    file = "",               start = __ONCE_RUN__,  size = $BF00 - __STACKSIZE__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = __LCADDR__,    size = __LCSIZE__;
    # The set-up screen's overlay (src/overlay.h): its own file, loaded at
    # $0800 over the low buffers while it is open. TWOEGRAM.SYSTEM.1 is
    # copied to TWOEGRAM.SETUP for the disk.
    OVL1:   file = "%O.1",           start = $0800,         size = $1800;
    # Saving the conversation, the second overlay, TWOEGRAM.SAVE: over the
    # layout table and text buffer only (memcheck.py checks), since the
    # reply buffer above them is in use while it fetches.
    OVL2:   file = "%O.2",           start = $0800,         size = $1800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
    LOWBSS:   load = LOWMEM,         type = bss, optional = yes;
    OVERLAY1: load = OVL1,           type = ro,  define   = yes, optional = yes;
    OVERLAY2: load = OVL2,           type = ro,  define   = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
